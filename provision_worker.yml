---
- name: Automate Slurm Worker Node Provisioning
  hosts: slurm_workers
  gather_facts: true
  tasks:
    - name: Ensure /etc/hosts has all cluster members
      ansible.builtin.blockinfile:
        path: /etc/hosts
        block: |
          192.168.1.130 slurm-head
          192.168.1.131 slurm-node1
          192.168.1.132 slurm-node2
        marker: "# {mark} ANSIBLE MANAGED SLURM HOSTS"

    - name: Configure and generate UTF-8 locales
      block:
        - name: Ensure en_US.UTF-8 is in locale.gen
          ansible.builtin.lineinfile:
            path: /etc/locale.gen
            line: "en_US.UTF-8 UTF-8"
            state: present
        - name: Generate locales
          ansible.builtin.command: locale-gen
        - name: Set default system locale
          ansible.builtin.command: update-locale LANG=en_US.UTF-8

    - name: Install required baseline packages
      ansible.builtin.apt:
        name:
          - curl
          - vim
          - sudo
          - nfs-common
          - munge
          - libmunge-dev
          - slurmd
          - slurm-client
        state: present
        update_cache: yes

    - name: Stop services prior to ID alignment
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: stopped
      loop:
        - slurmd
        - munge
      ignore_errors: true

    - name: Enforce strict cluster-wide GIDs
      ansible.builtin.group:
        name: "{{ item.name }}"
        gid: "{{ item.gid }}"
        state: present
      loop:
        - { name: 'munge', gid: 1001 }
        - { name: 'slurm', gid: 1002 }
        - { name: 'researcher', gid: 2001 }

    - name: Enforce strict cluster-wide UIDs and Shells
      ansible.builtin.user:
        name: "{{ item.name }}"
        uid: "{{ item.uid }}"
        group: "{{ item.group }}"
        home: "{{ item.home }}"
        shell: "{{ item.shell }}"
        state: present
      loop:
        - { name: 'munge', uid: 1001, group: 'munge', home: '/var/lib/munge', shell: '/usr/sbin/nologin' }
        - { name: 'slurm', uid: 1002, group: 'slurm', home: '/var/lib/slurm', shell: '/bin/bash' }
        - { name: 'researcher', uid: 2001, group: 'researcher', home: '/home/researcher', shell: '/bin/bash' }

    - name: Create required Slurm and Munge directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - { path: '/etc/slurm', owner: 'root', group: 'root', mode: '0755' }
        - { path: '/var/spool/slurmd', owner: 'root', group: 'root', mode: '0755' }
        - { path: '/var/log/slurm', owner: 'slurm', group: 'slurm', mode: '0755' }
        - { path: '/etc/munge', owner: 'munge', group: 'munge', mode: '0700' }
        - { path: '/var/lib/munge', owner: 'munge', group: 'munge', mode: '0711' }
        - { path: '/var/log/munge', owner: 'munge', group: 'munge', mode: '0700' }
        - { path: '/run/munge', owner: 'munge', group: 'munge', mode: '0755' }
        - { path: '/shared', owner: 'root', group: 'root', mode: '0755' }

    - name: Deploy cluster MUNGE cryptographic key
      ansible.builtin.copy:
        src: files/munge.key
        dest: /etc/munge/munge.key
        owner: munge
        group: munge
        mode: '0400'
      notify: Restart Munge

    - name: Deploy unified slurm.conf
      ansible.builtin.copy:
        src: files/slurm.conf
        dest: /etc/slurm/slurm.conf
        owner: root
        group: root
        mode: '0644'
      notify: Restart Slurmd

    - name: Mount shared NFS cluster storage
      ansible.posix.mount:
        path: /shared
        src: "{{ nfs_server }}:{{ nfs_share }}"
        fstype: nfs
        opts: defaults
        state: mounted

    - name: Ensure munge daemon is enabled and running
      ansible.builtin.systemd:
        name: munge
        state: started
        enabled: yes

    - name: Ensure slurmd compute daemon is enabled and running
      ansible.builtin.systemd:
        name: slurmd
        state: started
        enabled: yes

  handlers:
    - name: Restart Munge
      ansible.builtin.systemd:
        name: munge
        state: restarted

    - name: Restart Slurmd
      ansible.builtin.systemd:
        name: slurmd
        state: restarted
